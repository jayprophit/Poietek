[package]
name = "poietek"
version = "0.1.0"
description = "Poietek Studio native shell"
authors = ["Poietek"]
edition = "2021"

[lib]
name = "poietek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
