name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x]
        include: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node dependencies
        working-directory: Poietek-Studio
        run: npm ci

      - name: Typecheck (TS)
        working-directory: Poietek-Studio
        run: npm run typecheck || true

      - name: Run JS tests
        working-directory: Poietek-Studio
        run: npm test || true

      - name: Cache Rust cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/src-tauri/Cargo.toml') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Tauri (Rust)
        working-directory: Poietek-Studio/src-tauri
        run: |
          cargo build --release

      - name: Install CMake and build native-core
        if: always()
        run: |
          mkdir -p Poietek-Studio/native-core/build
          cd Poietek-Studio/native-core/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Run native-core tests (ctest)
        if: always()
        run: |
          cd Poietek-Studio/native-core/build
          ctest --output-on-failure || true

      - name: Tauri bundle (native installers)
        working-directory: Poietek-Studio
        env:
          TAURI_BUILD_TARGETS: "all"
        run: |
          # Attempt to create native bundles for the current runner OS. This may
          # require extra platform-specific tools (makensis on Windows, hdiutil on macOS).
          # We run the existing npm script which calls the tauri bundler.
          npm run native:build || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poietek-build-${{ matrix.os }}
          path: |
            Poietek-Studio/dist
            Poietek-Studio/src-tauri/target/release
            Poietek-Studio/native-core/build
            Poietek-Studio/src-tauri/target/release/bundle || Poietek-Studio/src-tauri/target/release/bundle/**
