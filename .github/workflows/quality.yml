name: Quality gate

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Verify application, native contracts, tests, and web build
        run: npm run verify
