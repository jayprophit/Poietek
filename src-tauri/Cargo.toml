[package]
name = "poietek-studio"
version = "0.1.0"
description = "Poietek Studio native shell"
authors = ["Poietek"]
edition = "2021"
rust-version = "1.85"
publish = false
homepage = "https://github.com/jayprophit/Studio-Daw-Station-SDS-"

[lib]
name = "poietek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thread-priority = { version = "0.3", optional = true }

[features]
# feature to enable best-effort priority escalation on supported platforms
priority = ["thread-priority"]
# feature to enable optional C API ringbuffer FFI bindings for integration tests
ring-ffi = []


[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
cpal = "=0.18.1"
midir = "=0.11.0"
